name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck libarchive-tools gnupg openssl python3 curl
      - name: Syntax
        run: bash -n netboot-android.sh tests/run.sh
      - name: ShellCheck
        run: shellcheck -S warning netboot-android.sh
      - name: Fault-injection tests
        run: tests/run.sh
